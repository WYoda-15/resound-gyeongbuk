<style>
  /* 노션 임베드 칸 안에서 영상을 16:9로 맞춤.
     칸이 영상보다 높으면 위에 붙이고, 넓으면 가운데 둠. 남는 부분은 노션 배경색이 그대로 보이게 투명 처리.
     color-scheme을 light dark로 두어야 노션 다크 모드에서 남는 부분이 흰색으로 칠해지지 않음 */
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center; }
  .frame {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    max-width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  /* ?fit=fill : 플레이어가 칸 전체를 채움 (영상은 유튜브가 검은 띠로 맞춤, 칸 전체가 터치됨) */
  html.fill .frame { width: 100%; height: 100%; aspect-ratio: auto; }
  .frame > iframe, .frame > #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .fallback {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
    color: #eee; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    text-align: center;
  }
  .fallback a { color: #fff; }
</style>
</head>
<body>
<div class="stage"><div class="frame"><div id="player"></div></div></div>
<script src="../player.js"></script>
</body>
